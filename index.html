
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Quiz Generator | Groq</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    padding: 20px;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

.container {
    max-width: 750px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 10px 35px #0003;
}

h1 {
    text-align: center;
    color: #6045bd;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 15px 0 8px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    outline-color: #6652cc;
}

button {
    border: none;
    padding: 13px 20px;
    border-radius: 8px;
    background: #6652cc;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
}

button:hover {
    background: #4934a5;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.generate-btn {
    width: 100%;
}

#quizSection, #resultSection {
    display: none;
    margin-top: 25px;
}

.progress {
    height: 9px;
    background: #eee;
    border-radius: 10px;
    margin: 15px 0;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #6652cc;
    transition: width .3s;
}

.option {
    display: block;
    width: 100%;
    text-align: left;
    background: #f1f1f8;
    color: #333;
    border: 2px solid transparent;
    margin-top: 10px;
}

.option:hover {
    background: #e4e0ff;
}

.option.correct {
    background: #d4edda;
    border-color: #28a745;
}

.option.wrong {
    background: #f8d7da;
    border-color: #dc3545;
}

#feedback {
    margin-top: 15px;
    font-weight: bold;
}

#resultSection {
    text-align: center;
}

.score {
    font-size: 45px;
    color: #6652cc;
    margin: 20px;
}

.status {
    text-align: center;
    margin-top: 15px;
    color: #6045bd;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.api-note {
    font-size: 12px;
    color: #777;
    margin-top: 8px;
}

@media(max-width:600px) {
    .container {
        padding: 20px;
        margin: 10px auto;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>🤖 AI Quiz Generator</h1>
    <p class="subtitle">
        Generate unlimited topic-based quizzes using Groq AI
    </p>

    <div id="setupSection">

        <label>Groq API Key</label>
        <input type="password" id="apiKey"
               placeholder="Enter your Groq API key">

        <p class="api-note">
            Get your key from console.groq.com/keys
        </p>

        <label>Enter Quiz Topic</label>
        <input type="text" id="topic"
               placeholder="Example: Python Programming">

        <label>Select Difficulty</label>
        <select id="difficulty">
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
        </select>

        <label>Number of Questions</label>
        <select id="questionCount">
            <option value="5">5 Questions</option>
            <option value="10">10 Questions</option>
            <option value="15">15 Questions</option>
        </select>

        <button class="generate-btn" id="generateBtn"
                onclick="generateQuiz()">
            Generate AI Quiz 🚀
        </button>

        <p class="status" id="loading"></p>

    </div>

    <div id="quizSection">

        <h2 id="quizTopic"></h2>

        <p id="questionNumber"></p>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <h3 id="question" style="margin:20px 0;"></h3>

        <div id="options"></div>

        <p id="feedback"></p>

        <button id="nextBtn" onclick="nextQuestion()" disabled>
            Next Question →
        </button>

    </div>

    <div id="resultSection">

        <h2>🎉 Quiz Completed!</h2>

        <div class="score" id="score"></div>

        <h3 id="resultMessage"></h3>

        <button onclick="location.reload()">
            Generate Another Quiz
        </button>

    </div>

</div>

<script>

const API_URL =
"https://api.groq.com/openai/v1/chat/completions";

const MODEL = "llama-3.3-70b-versatile";

let questions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;


// Generate AI Quiz
async function generateQuiz() {

    const apiKey = document.getElementById("apiKey").value.trim();
    const topic = document.getElementById("topic").value.trim();
    const difficulty = document.getElementById("difficulty").value;
    const count = Number(document.getElementById("questionCount").value);

    const loading = document.getElementById("loading");
    const generateBtn = document.getElementById("generateBtn");

    if (!apiKey) {
        alert("Please enter your Groq API Key!");
        return;
    }

    if (!topic) {
        alert("Please enter a quiz topic!");
        return;
    }

    generateBtn.disabled = true;
    loading.innerText = "🤖 Groq AI is generating your quiz...";

    try {

        const prompt = `
Create exactly ${count} multiple-choice quiz questions.

Topic: ${topic}
Difficulty: ${difficulty}

Requirements:
1. Questions must be relevant to the topic.
2. Each question must have exactly 4 options.
3. Only one option must be correct.
4. Avoid duplicate questions.
5. Make questions factually accurate.
6. Return ONLY valid JSON without markdown.

Use this exact JSON structure:

{
  "questions": [
    {
      "question": "Question text",
      "options": [
        "Option A",
        "Option B",
        "Option C",
        "Option D"
      ],
      "answer": "Correct option exactly as written"
    }
  ]
}

Generate exactly ${count} questions.
`;

        const response = await fetch(API_URL, {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + apiKey
            },

            body: JSON.stringify({
                model: MODEL,

                messages: [
                    {
                        role: "system",
                        content: "You are an expert quiz generator. Return only valid JSON."
                    },
                    {
                        role: "user",
                        content: prompt
                    }
                ],

                temperature: 0.7,
                max_completion_tokens: 6000,
                response_format: {
                    type: "json_object"
                }
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message || "Groq API request failed."
            );
        }

        let content = data.choices?.[0]?.message?.content;

        if (!content) {
            throw new Error("AI returned an empty response.");
        }

        content = content
            .replace(/```json/gi, "")
            .replace(/```/g, "")
            .trim();

        const result = JSON.parse(content);

        if (!Array.isArray(result.questions) ||
            result.questions.length !== count) {
            throw new Error("AI returned an incorrect number of questions. Please try again.");
        }

        questions = result.questions.map(q => {

            if (
                typeof q.question !== "string" ||
                !Array.isArray(q.options) ||
                q.options.length !== 4 ||
                typeof q.answer !== "string" ||
                !q.options.includes(q.answer)
            ) {
                throw new Error("Invalid question format received from AI.");
            }

            return q;
        });

        currentQuestion = 0;
        score = 0;

        document.getElementById("setupSection").style.display = "none";
        document.getElementById("quizSection").style.display = "block";

        document.getElementById("quizTopic").innerText =
            topic.toUpperCase() + " QUIZ";

        loading.innerText = "";

        showQuestion();

    } catch (error) {

        loading.innerText = "❌ " + error.message;

        console.error(error);

    } finally {

        generateBtn.disabled = false;

    }
}


// Display Question
function showQuestion() {

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").innerText =
        `Question ${currentQuestion + 1} of ${questions.length}`;

    document.getElementById("progressBar").style.width =
        ((currentQuestion + 1) / questions.length * 100) + "%";

    document.getElementById("question").innerText = q.question;

    document.getElementById("feedback").innerText = "";

    document.getElementById("nextBtn").disabled = true;

    const optionsDiv = document.getElementById("options");

    optionsDiv.innerHTML = "";

    q.options.forEach(option => {

        const btn = document.createElement("button");

        btn.className = "option";
        btn.innerText = option;

        btn.onclick = () => checkAnswer(btn, option);

        optionsDiv.appendChild(btn);

    });

}


// Check Answer
function checkAnswer(button, selected) {

    if (answered) return;

    answered = true;

    const correct = questions[currentQuestion].answer;

    const buttons = document.querySelectorAll(".option");

    buttons.forEach(btn => {

        btn.disabled = true;

        if (btn.innerText === correct) {
            btn.classList.add("correct");
        }

    });

    if (selected === correct) {

        score++;

        document.getElementById("feedback").innerText =
            "✅ Correct Answer!";

    } else {

        button.classList.add("wrong");

        document.getElementById("feedback").innerText =
            "❌ Wrong Answer! Correct: " + correct;

    }

    document.getElementById("nextBtn").disabled = false;

}


// Next Question
function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        showResult();

    }

}


// Show Result
function showResult() {

    document.getElementById("quizSection").style.display = "none";

    document.getElementById("resultSection").style.display = "block";

    document.getElementById("score").innerText =
        score + " / " + questions.length;

    const percentage = (score / questions.length) * 100;

    const message = percentage >= 80
        ? "Excellent! Amazing Performance 🏆"
        : percentage >= 50
        ? "Good Job! Keep Practicing 👍"
        : "Keep Learning! You Can Do Better 💪";

    document.getElementById("resultMessage").innerText = message;

}

</script>

</body>
</html>
```
